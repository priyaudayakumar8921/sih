<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Login - SkillBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--bg-main); color: var(--text-primary); }
        .auth-container { background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: center; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-secondary); }
        .input-group input { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); }
        .btn-auth { width: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); color: white; padding: 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 1rem; }
        .error { color: var(--danger); margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body class="dark-theme">
    <div class="auth-container">
        <h2 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-layer-group text-accent"></i> Developer Login</h2>
        <p class="text-secondary" style="margin-bottom: 1.5rem; font-size: 0.9rem;">Test Firebase Authentication flow locally.</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="demo@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-auth">Sign In / Register</button>
        </form>
        <div id="error-msg" class="error"></div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
